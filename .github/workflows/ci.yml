# Integración continua de Mini Inventario: corre las pruebas de Playwright
# en cada pull request hacia main. Los valores vienen de los secretos del
# repositorio (Settings → Secrets and variables → Actions); aquí no hay ninguno escrito.
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

# Si subes otro commit al mismo PR, se cancela la corrida anterior.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: Pruebas de Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
      CI: true
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Revisar que existan los secretos
        run: |
          faltan=""
          for v in SUPABASE_URL SUPABASE_KEY TEST_EMAIL TEST_PASSWORD; do
            if [ -z "${!v}" ]; then faltan="$faltan $v"; fi
          done
          if [ -n "$faltan" ]; then
            echo "::error::Faltan secretos del repositorio:$faltan (créalos con gh secret set)"
            exit 1
          fi
          echo "Los 4 secretos están configurados."

      - name: Instalar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias (npm ci)
        run: npm ci

      - name: Instalar Chromium y sus dependencias
        run: npx playwright install --with-deps chromium

      - name: Correr las pruebas de Playwright
        run: npx playwright test

      - name: Subir el reporte de Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: reporte-playwright
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
